[package]
name = "git"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/yoshuawuyts/components"
description = "Self-contained Git repository operations for Wasm agents"
readme = "README.md"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gix = { version = "=0.88.0", default-features = false, features = ["sha1", "revision"] }
wit-bindgen = "=0.57.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
